<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStream</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h1>MusicStream</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="#" class="active"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="#"><i class="fas fa-search"></i> Buscar</a></li>
                    <li><a href="#"><i class="fas fa-book"></i> Biblioteca</a></li>
                    <li><a href="#"><i class="fas fa-plus-square"></i> Criar Playlist</a></li>
                    <li><a href="#"><i class="fas fa-heart"></i> Músicas Curtidas</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="user-controls">
                    <button class="nav-button"><i class="fas fa-chevron-left"></i></button>
                    <button class="nav-button"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="user-menu">
                    <button class="profile-button">
                        <img src="https://via.placeholder.com/32" alt="Perfil" class="profile-pic">
                        <span>Usuário</span>
                        <i class="fas fa-caret-down"></i>
                    </button>
                </div>
            </header>

            <section class="content">
                <h2>Músicas Populares</h2>
                <div id="lista-de-musicas" class="music-grid">
                    <!-- Os cards de música serão inseridos aqui via JavaScript -->
                </div>
            </section>
        </main>

        <!-- Player -->
        <footer class="player">
            <div class="now-playing">
                <img src="https://via.placeholder.com/56" alt="Capa do álbum" class="album-thumb">
                <div class="track-info">
                    <h4 class="track-name">Nome da Música</h4>
                    <p class="artist-name">Nome do Artista</p>
                </div>
                <button class="like-button"><i class="far fa-heart"></i></button>
            </div>
            <div class="player-controls">
                <div class="control-buttons">
                    <button><i class="fas fa-shuffle"></i></button>
                    <button><i class="fas fa-step-backward"></i></button>
                    <button class="play-button"><i class="fas fa-play"></i></button>
                    <button><i class="fas fa-step-forward"></i></button>
                    <button><i class="fas fa-redo"></i></button>
                </div>
                <div class="progress-bar">
                    <span class="time current">0:00</span>
                    <div class="progress">
                        <div class="progress-filled"></div>
                    </div>
                    <span class="time total">3:30</span>
                </div>
            </div>
            <div class="volume-controls">
                <button><i class="fas fa-volume-up"></i></button>
                <div class="volume-bar">
                    <div class="volume-filled"></div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
